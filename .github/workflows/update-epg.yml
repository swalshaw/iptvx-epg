name: Update IPTVX EPG

on:
  workflow_dispatch:

  push:
    branches:
      - main

  schedule:
    - cron: "0 6 * * *"
      timezone: "Pacific/Auckland"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Build merged EPG
        run: python merge_epg.py

      - name: Disable Jekyll
        run: touch public/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload EPG to GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy EPG
        id: deployment
        uses: actions/deploy-pages@v4
